            --secondary: #fbbf24;

        .pill {

        .btn {

            color: var(--text-main);

            color: #fff;
            border-color: var(--secondary);

            display: flex;
            gap: 10px;
            flex-wrap: wrap;

            min-width: 220px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 0.95rem;

            padding: 20px;
            margin-bottom: 20px;

            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;

            color: #fff;

            border-radius: 12px;
            font-size: 0.8rem;

            font-weight: 700;
            color: var(--secondary);
            background: var(--bg-opt);
            padding: 3px 10px;
            border-radius: 10px;

        .q-text {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 14px;
            white-space: pre-line;
        }

        .opt-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 680px) {
            .opt-grid {
                grid-template-columns: 1fr;
            }
            .q-card {
                padding: 15px;
            }
        }

        .opt-btn {
            background: var(--bg-opt);
            border: 1.5px solid var(--border);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;

        .opt-btn:hover:not(:disabled) {

        .opt-btn.correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;

        }

        .opt-btn.wrong {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;

</head>

    let score = 0;
    let attempts = 0;

    function renderQuiz() {
        score = 0;
        attempts = 0;
        updateStats();

        const container = document.getElementById('quizList');
        container.innerHTML = questions.map((item, qIdx) => `
            <div class="q-card" id="qcard-${qIdx}">
                <div class="q-meta">
                    <span class="q-num">ಪ್ರಶ್ನೆ ${qIdx + 1}</span>
                    <span class="q-tag">📌 ${item.tag}</span>
                </div>
                <div class="q-text">${item.q}</div>
                <div class="opt-grid">
                    ${item.opts.map((opt, oIdx) => `
                        <button class="opt-btn" id="opt-${qIdx}-${oIdx}" onclick="selectOption(${qIdx}, ${oIdx})">${opt}</button>
                    `).join('')}
                </div>
                <div class="exp-box" id="exp-${qIdx}">
                    💡 <strong>ಪರೀಕ್ಷಾ ವಿವರಣೆ:</strong> ${item.exp}
                </div>
            </div>
        `).join('');
    }

    function selectOption(qIdx, oIdx) {
        const qItem = questions[qIdx];
        const allBtns = document.querySelectorAll(`#qcard-${qIdx} .opt-btn`);
        allBtns.forEach(b => b.disabled = true);

        const clicked = document.getElementById(`opt-${qIdx}-${oIdx}`);
        const correct = document.getElementById(`opt-${qIdx}-${qItem.ans}`);

        attempts++;
        if (oIdx === qItem.ans) {
            clicked.classList.add('correct');
            score++;
        } else {
            clicked.classList.add('wrong');
            correct.classList.add('correct');
        }

        document.getElementById(`exp-${qIdx}`).classList.add('show');
        updateStats();
    }

    function revealAllAnswers() {
        questions.forEach((item, qIdx) => {
            const allBtns = document.querySelectorAll(`#qcard-${qIdx} .opt-btn`);
            allBtns.forEach(b => b.disabled = true);
            document.getElementById(`opt-${qIdx}-${item.ans}`).classList.add('correct');
            document.getElementById(`exp-${qIdx}`).classList.add('show');
        });
    }

    function resetQuiz() {
        renderQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateStats() {
        document.getElementById('scoreText').innerText = `🎯 ಅಂಕ: ${score} / ${questions.length}`;
        document.getElementById('attemptText').innerText = `ಉತ್ತರಿಸಿದವು: ${attempts} / ${questions.length}`;
    }

    function setTheme(mode) {
        const body = document.body;
        if (mode === 'paper') body.removeAttribute('data-theme');
        else body.setAttribute('data-theme', mode);
    }

    function filterQuestions() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        questions.forEach((item, qIdx) => {
            const card = document.getElementById(`qcard-${qIdx}`);
            const text = card.innerText.toLowerCase();
            card.style.display = (!query || text.includes(query)) ? 'block' : 'none';
        });
    }

    window.onload = renderQuiz;
</script>

</body>
</html>
